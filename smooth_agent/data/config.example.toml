# Smooth Agent config. `smooth-agent setup` writes this to ~/.smooth-agent/config.toml.
# Secrets never go here: put keys in ~/.smooth-agent/.env (or your environment) and
# name the variable with key_env. `default` is used unless you pass -p; `fallbacks`
# are tried in order when it fails.
default = "main"
# fallbacks = ["backup"]

[providers.main]
provider = "deepseek"        # PROVIDER
model = "deepseek-chat"       # MODEL
# presets: openai, anthropic, deepseek, glm, groq, openrouter, kimi, smooth-router, 9router, openai-compatible
# the key is read from the preset's env var (DEEPSEEK_API_KEY, OPENAI_API_KEY, ANTHROPIC_API_KEY, GLM_API_KEY, ...)

# [providers.backup]
# provider = "smooth-router"   # or "9router", or "openai-compatible" with base_url
# model = "anthropic/claude-haiku-5-5"
# base_url = "http://127.0.0.1:20150/v1"
# key_env = "SMOOTH_ROUTER_KEY"

[agent]
# workspace = "~/smooth-workspace"   # the folder the agent reads and writes (default ~/.smooth-agent/workspace,
                                     # where SOUL.md, IDENTITY.md, USER.md, AGENTS.md, TOOLS.md, MEMORY.md live)
max_steps = 12                        # tool rounds per message
max_tokens = 4096                     # per reply; reasoning models think inside this budget
# instructions = "Answer in Indonesian. Keep replies short."
# timezone = "Asia/Jakarta"          # for schedules and "tomorrow at 9" (default: this machine's)
memory = true                         # long-term memory + saved, searchable sessions
context_tokens = 64000                # older messages are summarised beyond ~80% of this
keep_recent = 10                      # messages kept word-for-word when summarising

[tools]
http = true            # web_search, web_extract, http_get
search = "auto"        # auto: Tavily / Brave / SearXNG when TAVILY_API_KEY / BRAVE_API_KEY / SEARXNG_URL is set, else DuckDuckGo
files = "workspace"    # "full" = file tools reach the whole machine; writes outside the workspace
                       #   and secret files (keys, .env, ~/.ssh) ask you first
terminal = false       # shell commands + Python on this machine (as your user), and background processes
confirm = true         # ask before every terminal / execute_code call
timeout = 180          # seconds per command
delegate = true        # delegate_task: parallel sub-agents
skills = true
optional_skills = false
# enable_skills = ["sherlock", "evm"]   # turn on single optional skills
# skill_dirs = ["~/my-skills"]

[browser]
enabled = false        # needs: pip install "smooth-agent[browser]" && python -m playwright install chromium
headless = true
# profile_dir = ""     # default ~/.smooth-agent/browser/profile (keeps logins); "none" = fresh every run

[vision]               # image understanding; defaults to the main provider/model
# provider = "anthropic"
# model = "claude-haiku-5-5"

# [image]              # image generation (OpenAI-compatible /images/generations)
# provider = "openai"
# model = "gpt-image-1"

# [tts]                # text to speech (OpenAI-compatible /audio/speech)
# provider = "openai"
# model = "gpt-4o-mini-tts"
# voice = "alloy"

[channels]
# Talk to the agent from chat apps. `smooth-agent daemon` runs these plus your cron jobs.
# Only ids on a channel's `owners` list are answered. Message the bot once and it replies with your id.
enabled = []           # e.g. ["telegram"]
webhook_host = "0.0.0.0"
webhook_port = 8808    # inbound webhook server (WhatsApp); expose it with a reverse proxy

# [channels.telegram]
# token_env = "TELEGRAM_BOT_TOKEN"   # bot token from @BotFather, kept in .env
# owners = ["123456789"]             # your numeric Telegram id
# auto_approve = false               # approve the owner's tool calls without a button tap

# [channels.whatsapp]                # Meta WhatsApp Cloud API; point the webhook at <host>/webhook/whatsapp
# token_env = "WHATSAPP_TOKEN"
# phone_id = "123456789012345"
# verify_token = "a-secret-you-choose"
# owners = ["628123456789"]

# [channels.wechat]                  # WeChat Work group robot, for delivery / alerts
# webhook_url_env = "WECHAT_ROBOT_URL"
# owners = ["robot"]

# [channels.slack]                   # Slack app: Event Subscriptions -> <host>/webhook/slack (message.im)
# token_env = "SLACK_BOT_TOKEN"      # xoxb-...
# signing_secret_env = "SLACK_SIGNING_SECRET"
# owners = ["U0123ABCD"]             # your Slack user id

# [channels.matrix]                  # any homeserver; invite the bot to a room and it joins
# homeserver = "https://matrix.org"
# token_env = "MATRIX_TOKEN"         # the bot account's access token
# owners = ["@you:matrix.org"]

# [channels.line]                    # LINE Messaging API: webhook -> <host>/webhook/line
# token_env = "LINE_CHANNEL_TOKEN"   # channel access token
# secret_env = "LINE_CHANNEL_SECRET"
# owners = ["U1234567890abcdef"]     # your LINE user id

# [channels.discord]                 # channel webhook, for delivery / alerts
# webhook_url_env = "DISCORD_WEBHOOK_URL"

[mcp]
confirm = false        # ask before every MCP tool call
